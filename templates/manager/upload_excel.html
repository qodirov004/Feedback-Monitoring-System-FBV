{% extends "base.html" %}

{% block title %}Excel orqali ma'lumot yuklash{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Excel orqali ma'lumotlarini yuklash</h1>
        
        <div class="flex flex-col md:flex-row items-start md:items-center gap-4">
            <!-- Shablonni yuklab olish tugmasi -->
            <a href="{% url 'feedback:download_student_template' %}"
               class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-100 transition w-full md:w-auto">
                📥 Shablonni yuklab olish
            </a>

            <!-- Excel yuklash formasi -->
            <form method="post" enctype="multipart/form-data" action="{% url 'feedback:upload_students_excel' %}"
                  class="w-full md:w-auto flex flex-col md:flex-row items-start md:items-center gap-2">
                {% csrf_token %}
                <input type="file" name="excel_file" accept=".xlsx"
                       class="block w-full text-sm text-gray-700 border border-gray-300 rounded-md shadow-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition" required>
                <button type="submit"
                        class="inline-flex items-center justify-center px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition w-full md:w-auto">
                    ⬆️ Excel orqali yuklash
                </button>
            </form>
        </div>

        {% if messages %}
            <div class="mt-6">
                {% for message in messages %}
                    <div class="text-sm text-{{ message.tags }}-700 bg-{{ message.tags }}-100 p-3 rounded">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
